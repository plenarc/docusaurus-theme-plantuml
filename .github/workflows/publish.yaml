name: Publish to npm

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual publish)'
        type: boolean
        default: true

jobs:
  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      unpublished: ${{ steps.check.outputs.unpublished }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check npm registry and tag if unpublished
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "unpublished=false" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE}@${VERSION} is already published to npm."
          else
            echo "unpublished=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE}@${VERSION} is not yet published to npm."

            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
                echo "Tag ${TAG} already exists, skipping tag push."
              else
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git tag "${TAG}"
                git push origin "${TAG}"
              fi

              if gh release view "${TAG}" >/dev/null 2>&1; then
                echo "Release ${TAG} already exists, skipping release creation."
              else
                gh release create "${TAG}" --title "${TAG}" --generate-notes
              fi
            else
              echo "Not on main (ref=${GITHUB_REF}); skipping tag/release creation."
            fi
          fi

  publish:
    name: Publish Package
    needs: tag-release
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.tag-release.outputs.unpublished == 'true')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Publish to npm
        run: npm publish --access public --provenance ${{ (github.event_name == 'pull_request' || inputs.dry_run == true) && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
