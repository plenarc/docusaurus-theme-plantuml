name: Test Build on PR

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Verify Build & Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format

      - name: Lint
        run: pnpm run lint

      - name: Build project
        run: pnpm run build
